name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: versions.json geçerli mi?
        run: python3 -c "import json; d=json.load(open('app/src/main/assets/versions.json')); print(len(d['versions']), 'sürüm okundu')"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: APK derle
        run: gradle --no-daemon assembleDebug

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: virtual-android-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Testler APK'dan sonra çalışır: bir test hata verse bile APK yukarıda yüklenmiş olur.
      - name: Birim testleri
        continue-on-error: true
        run: gradle --no-daemon testDebugUnitTest
